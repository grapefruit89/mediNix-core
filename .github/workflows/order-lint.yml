---
name: Order Lint

on:
  push:
  pull_request:

jobs:
  folder-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Ordner-Spam-Lint (Regel: >= 3 Dateien, mit Ausnahmen)"
        run: bash docs/agents/shared/scripts/folder_lint.sh .

      # Projekt-Skills: Front-Matter mit name (== Ordnername, eindeutig) und
      # description. Der lokale Symlink (~/.config/opencode/skills) ist
      # maschinenlokal -> nicht CI-pruefbar, dafuer scripts/link-skills.sh.
      - name: "Projekt-Skills formal ok? (Front-Matter + mcp-Deklaration, docs/agents/**)"
        run: python3 scripts/check_skills.py

      # ADR-Formregel (id, Dateiname, Ueberschrift, Index-Registrierung).
      - name: "ADR-Formregel ok? (docs/adr/ADR-*.md + llm-index.json)"
        run: python3 scripts/check_adrs.py

      # NixOS-Grundfunktionen (ADR-0002): nur mechanisch pruefbares Stueck.
      - name: "Grundfunktionen ok? (ADR-0002: keine Container-Engine, keine unreinen Quellen)"
        run: python3 scripts/check_grundfunktionen.py

      # Kette: Registry -> Manifest -> Modul (jeder Dienst mit Port braucht einen
      # medinix.manifest-Eintrag; Ausnahmen in scripts/manifest-edge-allowlist.txt).
      - name: "Kante Registry -> Manifest ok? (scripts/check_manifest_edge.py)"
        run: python3 scripts/check_manifest_edge.py

      # Kette: Korridor -> Checks. Muster mit dokumentierten Ausnahmen
      # (scripts/corridor-allowlist.txt): DynamicUser, Group=media, stateDir-Suffix,
      # hartkodierte uid.
      - name: "Korridor-Muster ok? (scripts/check_corridor.py)"
        run: python3 scripts/check_corridor.py

      # NixOS-Vokabular (Semantic Anchors): Katalog-Lint - alle acht Felder je
      # Anker, Quelle mit Jahr, Durchsetzung zeigt auf existierenden Check/AB-Regel.
      - name: "NixOS-Anchors vollstaendig? (docs/NIXOS-ANCHORS.md)"
        run: python3 scripts/check_nixos_anchors.py

      # Verbotene Technologien (Denylist): nur AKTIVIERENDE Muster; verbietende
      # Assertions und Kommentare/Meldungen sind erlaubt.
      - name: "Verbotene Technologien? (BANNED_TECHNOLOGIES.md)"
        run: python3 scripts/check_banned_technologies.py

      # Schicht 0a: Klassische-Distro-Reflexe (P0) - Exit 1 bei Fund.
      - name: "NixOS-Idiome ok? (scripts/nixos_idiom_audit.py --p0-only)"
        run: python3 scripts/nixos_idiom_audit.py --p0-only

      # docs/TODO.md ist eine ABLEITUNG (Korridor + ROADMAP.md + AUDIT-LEDGER.md),
      # damit es keine zweite Planungsquelle gibt. Aendert sich eine Quelle, muss
      # die Liste neu erzeugt werden - sonst driftet sie still.
      - name: "TODO-Liste aktuell? (docs/TODO.md = Korridor + Roadmap + Ledger)"
        run: python3 scripts/gen_todo.py --check

      # Die Service Map in docs/INDEX.md ist aus lib/registry.nix (SSoT) abgeleitet.
      # Historie: die handgepflegte Fassung zeigte noch die flat GID 5000 als
      # Primaergruppe (ADR-0000 §5 verwirft das) und listete 15 von 16 Diensten.
      - name: "Service Map aktuell? (docs/INDEX.md = lib/registry.nix)"
        run: python3 scripts/gen_service_map.py --check
