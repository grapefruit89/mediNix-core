---
name: Export repository folders for LLM ingestion

# Liefert die Folder-Digests als CI-ARTEFAKT (upload-artifact). Bis 2026-10-16
# hat dieser Workflow sie zusaetzlich als Orphan-Branch `digests` gepusht
# (git push -f) - reiner Auto-Commit eines Artefakts, das byte-identisch aus dem
# main-Tree regenerierbar ist (nachgemessen: 15/15 cmp-identisch). Der Branch ist
# entfernt, der Auto-Commit damit auch; `contents: write` wurde nicht gebraucht.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: exports-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install tree & zip
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tree zip

      # Determinismus: die `tree`-Ausgabe ist locale-abhaengig (Sortierung). Ohne
      # C-Locale unterscheiden sich die Digests je nach Umgebung - siehe auch
      # `export LC_ALL=C` in .github/scripts/export-folders.sh.
      - name: Regenerate Markdown exports in /tmp/exports
        env:
          LC_ALL: C
        run: bash .github/scripts/export-folders.sh /tmp/exports

      - name: Upload digests artifact
        uses: actions/upload-artifact@v4
        with:
          name: medinix-digests
          path: |
            /tmp/exports/*.md
            /tmp/exports/all-exports.zip
          retention-days: 14
