name: Export repository folders for LLM ingestion

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: exports-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install tree & zip
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tree zip

      - name: Regenerate Markdown exports in /tmp/exports
        run: bash .github/scripts/export-folders.sh /tmp/exports

      - name: Upload digests artifact
        uses: actions/upload-artifact@v4
        with:
          name: medinix-digests
          path: |
            /tmp/exports/*.md
            /tmp/exports/all-exports.zip
          retention-days: 14

      - name: Push digests to orphan branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan digests 2>/dev/null || git checkout digests
          git rm -rf . >/dev/null 2>&1 || true
          cp /tmp/exports/*.md .
          git add -- *.md
          if git diff --cached --quiet; then
            echo "No digest changes detected."
          else
            git commit -m "chore(digests): update folder Markdown digests for ${GITHUB_SHA::7}"
            git push -f origin digests
          fi
