name: Export repository folders for LLM ingestion

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: exports-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install gitingest & zip
        run: |
          pip install --no-cache-dir gitingest
          sudo apt-get update -qq && sudo apt-get install -y -qq zip

      - name: Regenerate exports in /tmp/exports
        env:
          EXPORT_DIR: /tmp/exports
        run: bash .github/scripts/export-folders.sh

      - name: Upload digests artifact
        uses: actions/upload-artifact@v4
        with:
          name: medinix-digests
          path: |
            /tmp/exports/*.txt
            /tmp/exports/all-exports.zip
          retention-days: 14

      - name: Push digests to orphan branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan digests 2>/dev/null || git checkout digests
          git rm -rf . >/dev/null 2>&1 || true
          cp /tmp/exports/*.txt .
          git add *.txt
          if git diff --cached --quiet; then
            echo "No digest changes detected."
          else
            git commit -m "chore(digests): update folder digests for ${GITHUB_SHA::7}"
            git push -f origin digests
          fi
