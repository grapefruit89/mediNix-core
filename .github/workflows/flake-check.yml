name: Flake Check

on:
  push:
  pull_request:

jobs:
  flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM permissions
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          fi

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Closure zwischen Laeufen cachen — GitHub-Actions-Cache, KEIN Account und
      # KEIN Token noetig (Alternative waere cachix-action, braucht ein Secret).
      # Grund (gemessen 2026-10-15): die Voll-Stack-Ratsche deckt 43 Units, der
      # Closure waechst, und ohne Cache laedt JEDER frische Runner alles neu von
      # cache.nixos.org — das war die eigentliche Ursache der langen Laeufe.
      - uses: DeterminateSystems/magic-nix-cache-action@v15

      - run: nix flake check --print-build-logs

      # `nix flake check` baut nur CHECKS, nicht PACKAGES — deshalb konnte
      # packages.docs unbemerkt verrotten (Archiv 2026-10-15: docs_dir-Fehler).
      # Die Paketliste wird aus dem Flake abgeleitet, damit sie nicht driftet.
      - name: Build all flake packages
        run: |
          mapfile -t attrs < <(nix eval --raw .#packages.x86_64-linux --apply 'p: builtins.concatStringsSep "\n" (builtins.attrNames p)')
          for attr in "${attrs[@]}"; do
            echo "::group::build .#packages.x86_64-linux.${attr}"
            nix build --print-build-logs ".#packages.x86_64-linux.${attr}"
            echo "::endgroup::"
          done
