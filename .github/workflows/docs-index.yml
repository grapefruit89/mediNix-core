---
name: Docs Index (check-only)

# Frueher hat dieser Workflow INDEX.md erzeugt UND committet. Das war ein
# Wettlauf: jeder Push konnte von einem Auto-Commit ueberholt werden
# ("fetch first"-Absagen trotz gruener Leiter, 2026-10-16 dreimal passiert).
# Jetzt fail-closed wie der Rest der Leiter: der Index wird erzeugt und der
# Diff geprueft - ist er veraltet, wird der Lauf rot statt zu committen.
# Die Service Map prueft zusaetzlich order-lint (scripts/gen_service_map.py
# --check); beide Generatoren schreiben nachweislich denselben Inhalt.

on:
  # Nur Branch-Pushes: mit blankem `push:` feuert der Lauf auch bei Archiv-Tags
  # und prueft dann den alten Commit (Falsch-Rot 2026-10-16). `branches`
  # schliesst Tag-Refs aus (GitHub-Doku: nur definierte Ref-Typen loesen aus).
  push:
    branches: ['**']
    paths:
      - 'docs/**/*.md'
  workflow_dispatch:

jobs:
  check-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: "INDEX.md aktuell? (kein Auto-Commit)"
        run: |
          python3 docs/generate_index.py
          git diff --exit-code -- docs/INDEX.md
